name: Reproducible skincare experiment

on:
  push:
    branches:
      - experiment/reproducible-logistic-regression
    paths:
      - "train_model.py"
      - "requirements.txt"
      - "skincare_products_clean.csv"
      - ".github/workflows/experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run experiment
        run: python train_model.py
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: skincare-experiment-results
          path: experiment_output/
          if-no-files-found: error
